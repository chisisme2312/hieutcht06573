# ===============================================================
# CẤU HÌNH DỰ ÁN SPRING BOOT - SHOP BÁN ÁO THỜI TRANG LUÔN VUI TƯƠI
# ===============================================================
server.port=8080
spring.application.name=luon-vui-tuoi-shop

# Kết nối SQL Server 2022 (Database: luon_vui_tuoi_shop)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=luon_vui_tuoi_shop;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Tối ưu Hikari Connection Pool tăng tốc độ tải trang
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Cấu hình Hibernate JPA - BẬT open-in-view để fix triệt để lỗi proxy no Session
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Cấu hình Session kéo dài 30 ngày tránh bị văng ra màn hình đăng nhập
server.servlet.session.timeout=30d

# Cấu hình tài khoản nhận tiền VietQR cho POS (MBBank - LUON VUI TUOI SHOP)
pos.qr.bank-id=MB
pos.qr.account-number=0987654321
pos.qr.account-name=LUON VUI TUOI SHOP

