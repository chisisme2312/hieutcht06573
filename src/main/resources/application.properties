# ===============================================================
# CẤU HÌNH DỰ ÁN SPRING BOOT - SHOP BÁN ÁO THỜI TRANG LUÔN VUI TƯƠI
# ===============================================================
server.port=8080
spring.application.name=luon-vui-tuoi-shop

# Kết nối SQL Server 2022 (Database: luon_vui_tuoi_shop)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=luon_vui_tuoi_shop;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
