<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - LUÔN VUI TƯƠI SHOP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #dc2626;
            --brand-primary-hover: #b91c1c;
            --brand-dark: #0f172a;
            --brand-gray: #f8fafc;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #111827 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            color: #334155;
        }

        .login-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            padding: 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fef2f2;
            color: var(--brand-primary);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1px solid #fee2e2;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
        }

        .btn-brand {
            background-color: var(--brand-primary);
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
        }

        .btn-brand:hover {
            background-color: var(--brand-primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.45);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo & Header -->
        <div class="text-center mb-3">
            <div class="brand-badge">
                <i class="bi bi-person-plus-fill"></i> TẠO TÀI KHOẢN MỚI
            </div>
            <h3 class="fw-bold text-dark mb-1">Đăng Ký Tài Khoản</h3>
            <p class="text-muted small mb-0">Tạo tài khoản thành viên tại Luôn Vui Tươi Shop</p>
        </div>

        <!-- Alert lỗi nếu có -->
        <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 rounded-3 mb-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-6 flex-shrink-0"></i>
            <div th:text="${errorMsg}">Thông báo lỗi</div>
        </div>

        <!-- Form Đăng Ký -->
        <form th:action="@{/dang-ky}" method="post">
            <input type="hidden" name="redirect" th:value="${redirect}" />

            <div class="row g-2">
                <div class="col-12 mb-2">
                    <label class="form-label fw-semibold text-secondary small mb-1">Họ và Tên <span class="text-danger">*</span></label>
                    <input type="text" name="hoTen" class="form-control" th:value="${hoTen}" placeholder="Ví dụ: Nguyễn Văn A" required autofocus />
                </div>

                <div class="col-md-6 mb-2">
                    <label class="form-label fw-semibold text-secondary small mb-1">Số Điện Thoại <span class="text-danger">*</span></label>
                    <input type="tel" name="soDienThoai" class="form-control" th:value="${soDienThoai}" placeholder="Ví dụ: 0989xxxxxx" required />
                </div>

                <div class="col-md-6 mb-2">
                    <label class="form-label fw-semibold text-secondary small mb-1">Email (Tùy chọn)</label>
                    <input type="email" name="email" class="form-control" th:value="${email}" placeholder="email@gmail.com" />
                </div>

                <div class="col-12 mb-2">
                    <label class="form-label fw-semibold text-secondary small mb-1">Địa Chỉ Nhận Hàng Mặc Định</label>
                    <input type="text" name="diaChi" class="form-control" th:value="${diaChi}" placeholder="Số nhà, đường, Phường/Xã, Quận/Huyện, Tỉnh/TP" />
                    <div class="text-muted" style="font-size: 11px;">(Sẽ dùng làm địa chỉ mặc định khi mua hàng giống Shopee)</div>
                </div>

                <div class="col-md-6 mb-2">
                    <label class="form-label fw-semibold text-secondary small mb-1">Mật Khẩu <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="Tối thiểu 4 ký tự" minlength="4" required />
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-secondary small mb-1">Xác Nhận Mật Khẩu <span class="text-danger">*</span></label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" minlength="4" required />
                </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 mt-2">
                <i class="bi bi-person-check-fill me-1"></i> Đăng Ký Tài Khoản
            </button>
        </form>

        <!-- Đã có tài khoản? Đăng nhập ngay -->
        <div class="text-center pt-3 mt-3 border-top">
            <span class="text-muted small">Bạn đã có tài khoản?</span>
            <a th:href="@{/login(redirect=${redirect})}" class="text-danger fw-bold text-decoration-none ms-1 small">
                Đăng nhập ngay <i class="bi bi-arrow-right-short"></i>
            </a>
        </div>

        <!-- Quay lại trang chủ -->
        <div class="text-center pt-2">
            <a href="/" class="text-decoration-none text-muted small fw-semibold">
                <i class="bi bi-house me-1"></i> Quay lại trang chủ
            </a>
        </div>
    </div>
</div>

</body>
</html>
