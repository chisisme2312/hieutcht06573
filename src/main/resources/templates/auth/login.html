<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống - LUÔN VUI TƯƠI SHOP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #dc2626;
            --brand-primary-hover: #b91c1c;
            --brand-dark: #0f172a;
            --brand-gray: #f8fafc;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #111827 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: #334155;
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fef2f2;
            color: var(--brand-primary);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            border: 1px solid #fee2e2;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            font-size: 14.5px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
        }

        .btn-brand {
            background-color: var(--brand-primary);
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
        }

        .btn-brand:hover {
            background-color: var(--brand-primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.45);
        }

        .demo-chip {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .demo-chip:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0 18px 0;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <!-- Logo & Header -->
        <div class="text-center mb-4">
            <div class="brand-badge">
                <i class="bi bi-fire"></i> SHOP THỜI TRANG LUÔN VUI TƯƠI
            </div>
            <h3 class="fw-bold text-dark mb-1">Đăng Nhập Tài Khoản</h3>
            <p class="text-muted small mb-0">Hệ thống phân quyền Quản Trị Viên, Nhân Viên & Khách Hàng</p>
        </div>

        <!-- Alert thông báo lỗi nếu có -->
        <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 rounded-3 mb-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-6 flex-shrink-0"></i>
            <div th:text="${errorMsg}">Thông báo lỗi</div>
        </div>

        <!-- Alert thông báo thành công nếu có -->
        <div th:if="${successMsg}" class="alert alert-success d-flex align-items-center gap-2 py-2 px-3 rounded-3 mb-3 small" role="alert">
            <i class="bi bi-check-circle-fill fs-6 flex-shrink-0"></i>
            <div th:text="${successMsg}">Thông báo thành công</div>
        </div>

        <!-- Form đăng nhập -->
        <form th:action="@{/login}" method="post">
            <input type="hidden" name="redirect" th:value="${redirect}" />

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small mb-1">Tên đăng nhập / Email / Số điện thoại</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted" style="border-radius: 10px 0 0 10px;">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="usernameInput" name="usernameOrAccount" class="form-control border-start-0 ps-1"
                           th:value="${usernameOrAccount}" placeholder="Nhập tài khoản hoặc email..." required autofocus />
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-semibold text-secondary small mb-0">Mật khẩu</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted" style="border-radius: 10px 0 0 10px;">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="passwordInput" name="password" class="form-control border-start-0 border-end-0 ps-1"
                           placeholder="Nhập mật khẩu..." required />
                    <button class="input-group-text bg-light border-start-0 text-muted" type="button" onclick="togglePass()" style="border-radius: 0 10px 10px 0;">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập Hệ Thống
            </button>
        </form>

        <!-- Nút chọn nhanh tài khoản mẫu phục vụ kiểm thử & bảo vệ đồ án -->
        <div class="divider">Tài khoản demo kiểm thử</div>
        <div class="d-flex flex-column gap-2 mb-3">
            <div class="demo-chip" onclick="fillAccount('admin', '123456')">
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-danger text-white">ADMIN</span>
                    <span class="text-dark">Quản Trị Viên (admin)</span>
                </div>
                <i class="bi bi-arrow-right-short text-muted fs-5"></i>
            </div>
            <div class="demo-chip" onclick="fillAccount('staff01', '123456')">
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-primary text-white">STAFF</span>
                    <span class="text-dark">Nhân Viên POS (staff01)</span>
                </div>
                <i class="bi bi-arrow-right-short text-muted fs-5"></i>
            </div>
            <div class="demo-chip" onclick="fillAccount('an.nguyen@gmail.com', '123456')">
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-secondary text-white">KHÁCH HÀNG</span>
                    <span class="text-dark">Mua Hàng Online (an.nguyen)</span>
                </div>
                <i class="bi bi-arrow-right-short text-muted fs-5"></i>
            </div>
        </div>

        <!-- Quay lại trang chủ -->
        <div class="text-center pt-2 border-top">
            <a href="/" class="text-decoration-none text-muted small fw-semibold">
                <i class="bi bi-house me-1"></i> Quay lại trang chủ mua sắm
            </a>
        </div>
    </div>
</div>

<script>
    function togglePass() {
        const pass = document.getElementById('passwordInput');
        const icon = document.getElementById('toggleIcon');
        if (pass.type === 'password') {
            pass.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            pass.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }

    function fillAccount(username, password) {
        document.getElementById('usernameInput').value = username;
        document.getElementById('passwordInput').value = password;
    }
</script>
</body>
</html>
