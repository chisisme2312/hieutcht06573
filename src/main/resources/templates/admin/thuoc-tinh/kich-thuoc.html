<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/layout :: admin_head('Quản Lý Kích Thước - Luôn Vui Tươi Shop')}">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar chung -->
        <aside th:replace="~{admin/layout :: admin_sidebar('thuoc-tinh')}"></aside>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            
            <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <div>
                    <h3 class="fw-bold text-dark mb-1">📏 Quản Lý Kích Thước (Size)</h3>
                    <p class="text-muted mb-0 small">Thêm, sửa, xóa các size áo như S, M, L, XL, XXL...</p>
                </div>
                <div>
                    <a href="/admin/san-pham" class="btn btn-outline-secondary fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Về Quản Lý Sản Phẩm
                    </a>
                </div>
            </div>

            <!-- Thông báo -->
            <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show card-custom" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${thongBao}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${loi}" class="alert alert-danger alert-dismissible fade show card-custom" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${loi}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <!-- Cột trái: Form Thêm / Cập nhật -->
                <div class="col-lg-4">
                    <div class="card card-custom p-4">
                        <h5 class="fw-bold text-dark mb-3" th:text="${isEdit == true ? '✏️ Cập Nhật Kích Thước' : '➕ Thêm Kích Thước Mới'}">Thêm Size Mới</h5>
                        
                        <form th:action="@{/admin/thuoc-tinh/kich-thuoc/save}" th:object="${item}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary">Tên kích thước (Size) <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{tenKichThuoc}" class="form-control" placeholder="Ví dụ: S, M, L, XL, XXL..." required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary">Mô tả (Cân nặng/Chiều cao)</label>
                                <textarea th:field="*{moTa}" class="form-control" rows="3" placeholder="Ví dụ: Dành cho người từ 55 - 65kg..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary">Trạng thái hoạt động</label>
                                <select th:field="*{trangThai}" class="form-select">
                                    <option th:value="true">Đang hoạt động</option>
                                    <option th:value="false">Ngừng hoạt động</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-danger flex-grow-1 fw-bold">
                                    <i class="bi bi-save me-1"></i> Lưu Kích Thước
                                </button>
                                <a th:if="${isEdit == true}" href="/admin/thuoc-tinh/kich-thuoc" class="btn btn-light fw-semibold">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Cột phải: Bảng danh sách dữ liệu -->
                <div class="col-lg-8">
                    <div class="card card-custom p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-dark mb-0">📋 Danh Sách Kích Thước</h5>
                            <span class="badge bg-light text-dark border fw-bold" th:text="'Tổng: ' + ${danhSach.size()} + ' size'"></span>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width: 60px;">ID</th>
                                        <th>Size Áo</th>
                                        <th>Mô Tả Tiêu Chuẩn</th>
                                        <th>Trạng Thái</th>
                                        <th class="text-center" style="width: 140px;">Hành Động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="kt : ${danhSach}">
                                        <td class="fw-bold text-secondary" th:text="${kt.id}">1</td>
                                        <td class="fw-bold text-dark fs-6" th:text="${kt.tenKichThuoc}">M</td>
                                        <td class="text-muted" th:text="${kt.moTa != null ? kt.moTa : '-'}">-</td>
                                        <td>
                                            <span th:if="${kt.trangThai}" class="badge bg-success-subtle text-success border border-success-subtle badge-status">Hoạt động</span>
                                            <span th:unless="${kt.trangThai}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle badge-status">Ngừng</span>
                                        </td>
                                        <td class="text-center">
                                            <a th:href="@{'/admin/thuoc-tinh/kich-thuoc/edit/' + ${kt.id}}" class="btn btn-sm btn-outline-primary me-1" title="Sửa">
                                                <i class="bi bi-pencil-square"></i>
                                            </a>
                                            <a th:href="@{'/admin/thuoc-tinh/kich-thuoc/delete/' + ${kt.id}}" 
                                               onclick="return confirm('Bạn có chắc chắn muốn xóa kích thước này?')"
                                               class="btn btn-sm btn-outline-danger" title="Xóa">
                                                <i class="bi bi-trash3"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
