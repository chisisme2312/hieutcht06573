<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/layout :: admin_head('Quản Lý Hóa Đơn - Luôn Vui Tươi Shop')}"></head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <aside th:replace="~{admin/layout :: admin_sidebar('orders')}"></aside>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div th:replace="~{admin/layout :: admin_topbar('Quản Lý Hóa Đơn')}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <div>
                    <h4 class="fw-bold text-dark mb-1">🧾 Danh Sách Hóa Đơn Bán Hàng</h4>
                    <p class="text-secondary mb-0 small">Theo dõi toàn bộ hóa đơn bán hàng tại quầy (POS) và đơn hàng trực tuyến</p>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-danger fw-bold btn-sm px-3 shadow-sm" th:href="@{/admin/ban-hang}">
                        <i class="bi bi-shop me-1"></i> Mở Màn Hình POS
                    </a>
                    <button class="btn btn-outline-secondary fw-semibold btn-sm px-3" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Làm Mới
                    </button>
                </div>
            </div>

            <div class="card card-custom p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr class="small text-secondary text-uppercase fw-bold">
                                <th>Mã Hóa Đơn</th>
                                <th>Khách Hàng</th>
                                <th>Nhân Viên Thu Ngân</th>
                                <th>Hình Thức</th>
                                <th>Phương Thức</th>
                                <th class="text-end">Tổng Tiền (VNĐ)</th>
                                <th class="text-center">Trạng Thái</th>
                                <th>Ngày Tạo</th>
                                <th class="text-center">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="hd : ${hoaDonList}">
                                <td class="fw-bold text-danger font-monospace" th:text="${hd.maHoaDon}"></td>
                                <td>
                                    <span class="fw-semibold text-dark" th:text="${hd.khachHang != null ? hd.khachHang.hoTen : 'Khách vãng lai'}"></span>
                                </td>
                                <td>
                                    <span class="text-secondary small" th:text="${hd.nhanVien != null ? hd.nhanVien.hoVaTen : '-'}"></span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${hd.hinhThucMuaHang} ? 'bg-primary-subtle text-primary border border-primary-subtle' : 'bg-info-subtle text-info border border-info-subtle'" 
                                          th:text="${hd.hinhThucMuaHang} ? 'Tại Quầy (POS)' : 'Mua Online'"></span>
                                </td>
                                <td>
                                    <span class="small fw-semibold" th:text="${hd.phuongThucThanhToan} ? 'Chuyển khoản QR' : 'Tiền mặt'"></span>
                                </td>
                                <td class="text-end fw-extrabold text-danger" th:text="${#numbers.formatDecimal(hd.tongTien != null ? hd.tongTien : 0, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td class="text-center">
                                    <span class="badge" 
                                          th:classappend="${hd.trangThai == 'Đã hoàn thành' ? 'bg-success-subtle text-success border border-success-subtle' : (hd.trangThai == 'Chờ thanh toán' ? 'bg-warning-subtle text-warning border border-warning-subtle' : 'bg-secondary-subtle text-secondary border border-secondary-subtle')}"
                                          th:text="${hd.trangThai}"></span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(hd.ngayTao, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="text-center">
                                    <a class="btn btn-sm btn-outline-dark fw-semibold" th:href="@{/admin/hoa-don/{id}(id=${hd.id})}">
                                        <i class="bi bi-eye me-1"></i> Chi Tiết
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(hoaDonList)}">
                                <td colspan="9" class="text-center text-muted py-5">
                                    <i class="bi bi-receipt fs-2 d-block mb-2 text-secondary"></i>
                                    Chưa có hóa đơn nào trong hệ thống!
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
