<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<!-- Fragment Header chung -->
<head th:fragment="admin_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Hệ Thống Quản Trị - Luôn Vui Tươi Shop</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #111827;
            --sidebar-hover: #1f2937;
            --accent-red: #dc2626;
            --bg-page: #f8fafc;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: #0f172a;
        }
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-bg);
            color: #fff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }
        .sidebar .brand-box {
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar .nav-link {
            color: #94a3b8;
            font-weight: 500;
            padding: 11px 18px;
            border-radius: 8px;
            margin: 3px 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            text-decoration: none;
            font-size: 14px;
        }
        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
        }
        .sidebar .nav-link.active {
            background-color: var(--accent-red);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .nav-section-title {
            padding: 16px 20px 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
        }
        .card-custom {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            background: #ffffff;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
        }
        .table thead th {
            background-color: #f8fafc;
            color: #475569;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>

<!-- Fragment Sidebar chung: Gọn gàng chỉ giữ các phân hệ chính, KHÔNG có danh mục thuộc tính ở cột này -->
<aside th:fragment="admin_sidebar(activeMenu)" class="col-md-3 col-lg-2 d-md-block sidebar px-0">
    <div class="brand-box">
        <h5 class="fw-bold mb-0 text-white tracking-wide">LUÔN VUI TƯƠI</h5>
        <small class="text-secondary text-uppercase fw-semibold" style="font-size: 11px; letter-spacing: 1px;">Hệ Thống Quản Trị</small>
    </div>

    <div class="py-3">
        <a href="/admin" class="nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
            <i class="bi bi-speedometer2 me-2"></i> Tổng Quan (Dashboard)
        </a>
        <a href="/admin/san-pham" class="nav-link" th:classappend="${activeMenu == 'san-pham' || activeMenu == 'thuoc-tinh' ? 'active' : ''}">
            <i class="bi bi-box-seam me-2"></i> Quản Lý Sản Phẩm
        </a>

        <div class="nav-section-title">Nghiệp Vụ Bán Hàng</div>
        <a href="#" class="nav-link"><i class="bi bi-receipt me-2"></i> Quản Lý Hóa Đơn</a>
        <a href="#" class="nav-link"><i class="bi bi-ticket-perforated me-2"></i> Quản Lý Voucher</a>
        <a href="#" class="nav-link"><i class="bi bi-people me-2"></i> Quản Lý Khách Hàng</a>
        <a href="#" class="nav-link"><i class="bi bi-person-badge me-2"></i> Quản Lý Nhân Viên</a>

        <hr class="border-secondary mx-3 my-3 opacity-25">
        <a href="/" class="nav-link text-info"><i class="bi bi-shop me-2"></i> Ra Trang Bán Hàng</a>
    </div>
</aside>

</body>
</html>
