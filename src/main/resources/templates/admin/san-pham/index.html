<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sản Phẩm - Luôn Vui Tươi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">👕 Danh Sách Mẫu Áo (Admin)</h3>
        <div>
            <a href="/admin" class="btn btn-secondary me-2">Quay lại Dashboard</a>
            <button class="btn btn-success">+ Thêm Mẫu Áo Mới</button>
        </div>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Mã Áo</th>
                <th>Tên Mẫu Áo</th>
                <th>Loại Áo</th>
                <th>Thương Hiệu</th>
                <th>Chất Liệu</th>
                <th>Cổ Áo</th>
                <th>Trạng Thái</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sp : ${danhSach}">
                <td th:text="${sp.id}">1</td>
                <td class="fw-bold" th:text="${sp.maSanPham}">AT01</td>
                <td th:text="${sp.tenSanPham}">Tên áo</td>
                <td th:text="${sp.loaiSanPham.tenLoaiSanPham}">Áo thun</td>
                <td th:text="${sp.nhaCungCap.tenNhaCungCap}">Coolmate</td>
                <td th:text="${sp.chatLieu.tenChatLieu}">Cotton</td>
                <td th:text="${sp.coAo.tenCoAo}">Cổ tròn</td>
                <td>
                    <span th:if="${sp.trangThai}" class="badge bg-success">Đang bán</span>
                    <span th:unless="${sp.trangThai}" class="badge bg-secondary">Ngừng bán</span>
                </td>
                <td>
                    <button class="btn btn-sm btn-primary me-1">Sửa</button>
                    <button class="btn btn-sm btn-info me-1">Biến thể (Size/Màu)</button>
                    <button class="btn btn-sm btn-danger">Xóa</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
