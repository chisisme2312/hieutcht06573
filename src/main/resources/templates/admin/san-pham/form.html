<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/layout :: admin_head('Quản Lý Mẫu Áo - Luôn Vui Tươi Shop')}">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar chung -->
        <aside th:replace="~{admin/layout :: admin_sidebar('san-pham')}"></aside>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            
            <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <div>
                    <h3 class="fw-bold text-dark mb-1" th:text="${isEdit == true ? '✏️ Cập Nhật Mẫu Áo' : '➕ Thêm Mẫu Áo Mới'}">Thêm Mẫu Áo Mới</h3>
                    <p class="text-muted mb-0 small">Thiết lập thông tin áo, chọn thuộc tính (Màu sắc, Size, Chất liệu, Loại áo, Nhà cung cấp)</p>
                </div>
                <div>
                    <a href="/admin/san-pham" class="btn btn-outline-secondary fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Quay Lại Danh Sách
                    </a>
                </div>
            </div>

            <form th:action="@{/admin/san-pham/luu}" th:object="${sanPham}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-4">
                    
                    <!-- Khối 1: Thông tin cơ bản của mẫu áo -->
                    <div th:class="${isEdit == true ? 'col-lg-12' : 'col-lg-7'}">
                        <div class="card card-custom p-4 mb-4">
                            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-info-circle text-primary me-2"></i>1. Thông Tin Chung Mẫu Áo</h5>
                            
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold text-secondary">Mã sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{maSanPham}" class="form-control" placeholder="Ví dụ: AT02, POLO03..." required />
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label fw-semibold text-secondary">Tên mẫu áo <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{tenSanPham}" class="form-control" placeholder="Ví dụ: Áo Thun Cổ Tròn Basic 100% Cotton..." required />
                                </div>
                                
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold text-secondary">Loại sản phẩm (Loại áo) <span class="text-danger">*</span></label>
                                    <select th:field="*{loaiSanPham.id}" class="form-select" required>
                                        <option value="" disabled selected>-- Chọn loại sản phẩm --</option>
                                        <option th:each="lsp : ${listLoaiSanPham}" th:value="${lsp.id}" th:text="${lsp.tenLoaiSanPham}"></option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold text-secondary">Nhà cung cấp / Thương hiệu <span class="text-danger">*</span></label>
                                    <select th:field="*{nhaCungCap.id}" class="form-select" required>
                                        <option value="" disabled selected>-- Chọn nhà cung cấp --</option>
                                        <option th:each="ncc : ${listNhaCungCap}" th:value="${ncc.id}" th:text="${ncc.tenNhaCungCap}"></option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold text-secondary">Chất liệu vải <span class="text-danger">*</span></label>
                                    <select th:field="*{chatLieu.id}" class="form-select" required>
                                        <option value="" disabled selected>-- Chọn chất liệu --</option>
                                        <option th:each="cl : ${listChatLieu}" th:value="${cl.id}" th:text="${cl.tenChatLieu}"></option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary">Trạng thái kinh doanh</label>
                                    <select th:field="*{trangThai}" class="form-select" style="max-width: 250px;">
                                        <option th:value="true">Đang bán</option>
                                        <option th:value="false">Ngừng bán</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary">Mô tả sản phẩm</label>
                                    <textarea th:field="*{moTa}" class="form-control" rows="3" placeholder="Mô tả chất vải, form áo, hướng dẫn bảo quản..."></textarea>
                                </div>
                            </div>

                            <div class="mt-4 pt-3 border-top d-flex gap-2" th:if="${isEdit == true}">
                                <button type="submit" class="btn btn-danger px-4 py-2 fw-bold">
                                    <i class="bi bi-save me-1"></i> Lưu Thay Đổi
                                </button>
                                <a href="/admin/san-pham" class="btn btn-light fw-semibold">Hủy Bỏ</a>
                            </div>
                        </div>
                    </div>

                    <!-- Khối 2: Chỉ hiện khi Thêm Mới để sinh biến thể ban đầu -->
                    <div class="col-lg-5" th:if="${isEdit != true}">
                        <div class="card card-custom p-4 mb-4">
                            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-tags text-danger me-2"></i>2. Thuộc Tính Biến Thể</h5>
                            
                            <!-- Chọn màu sắc -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-secondary d-flex justify-content-between align-items-center">
                                    <span>Chọn Màu Sắc áp dụng <span class="text-danger">*</span></span>
                                    <a href="/admin/thuoc-tinh/mau-sac" target="_blank" class="small text-decoration-none">+ Thêm màu mới</a>
                                </label>
                                <div class="d-flex flex-wrap gap-2 p-2 border rounded bg-light">
                                    <div th:each="ms : ${listMauSac}" class="form-check me-2">
                                        <input class="form-check-input" type="checkbox" name="mauSacIds" th:value="${ms.id}" th:id="'ms_' + ${ms.id}" checked>
                                        <label class="form-check-label fw-semibold small text-dark" th:for="'ms_' + ${ms.id}" th:text="${ms.tenMauSac}">Đen</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Chọn kích thước -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-secondary d-flex justify-content-between align-items-center">
                                    <span>Chọn Kích Thước (Size) áp dụng <span class="text-danger">*</span></span>
                                    <a href="/admin/thuoc-tinh/kich-thuoc" target="_blank" class="small text-decoration-none">+ Thêm size mới</a>
                                </label>
                                <div class="d-flex flex-wrap gap-2 p-2 border rounded bg-light">
                                    <div th:each="kt : ${listKichThuoc}" class="form-check me-3">
                                        <input class="form-check-input" type="checkbox" name="kichThuocIds" th:value="${kt.id}" th:id="'kt_' + ${kt.id}" checked>
                                        <label class="form-check-label fw-bold small text-dark" th:for="'kt_' + ${kt.id}" th:text="${kt.tenKichThuoc}">M</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Thiết lập giá và số lượng ban đầu -->
                            <h6 class="fw-bold text-dark pt-2 border-top mb-3">Thiết Lập Giá & Kho</h6>
                            <div class="row g-3">
                                <div class="col-6">
                                    <label class="form-label fw-semibold text-secondary small">Giá bán thực tế (VNĐ)</label>
                                    <input type="number" name="giaBan" class="form-control" placeholder="199000" value="199000" required />
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold text-secondary small">Giá gốc ban đầu</label>
                                    <input type="number" name="giaBanBanDau" class="form-control" placeholder="250000" value="250000" />
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold text-secondary small">Số lượng tồn kho (mỗi size/màu)</label>
                                    <input type="number" name="soLuongTon" class="form-control" placeholder="50" value="50" required />
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-danger py-2 fw-bold text-uppercase">
                                    <i class="bi bi-plus-circle me-1"></i> Lưu & Khởi Tạo Mẫu Áo
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </form>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
