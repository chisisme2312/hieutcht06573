<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/layout :: admin_head('Thanh toán QR - POS')}"></head>
<body>
<div class="container-fluid">
    <div class="row">
        <aside th:replace="~{admin/layout :: admin_sidebar('pos')}"></aside>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h3 class="fw-bold mb-1">Thanh toán chuyển khoản QR</h3>
                    <p class="text-secondary mb-0">Hóa đơn: <span class="fw-bold text-danger" th:text="${hoaDon.maHoaDon}"></span></p>
                </div>
                <a th:href="@{/admin/ban-hang(hoaDonId=${hoaDon.id})}" class="btn btn-outline-secondary fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại POS
                </a>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card card-custom p-4 text-center shadow-sm border-0">
                        <div class="text-muted small fw-semibold text-uppercase">Số tiền cần thanh toán</div>
                        <div class="display-6 fw-bold text-danger mb-2" th:text="${#numbers.formatDecimal(hoaDon.tongTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                        <div class="fw-semibold text-dark mb-3 small bg-light py-2 px-3 rounded border d-inline-block mx-auto">
                            <i class="bi bi-receipt me-1"></i> Nội dung: <span class="text-danger fw-bold" th:text="${'Thanh toan ' + hoaDon.maHoaDon}"></span>
                        </div>

                        <!-- Ảnh QR VietQR -->
                        <div class="mb-3">
                            <img th:src="${qrUrl}" alt="Mã QR chuyển khoản ngân hàng" class="img-fluid border rounded-3 p-2 shadow-sm bg-white" style="max-width: 320px;">
                            <div class="mt-2">
                                <div class="fw-bold text-dark" th:text="${@environment.getProperty('pos.qr.account-name')}">LUÔN VUI TƯƠI SHOP</div>
                                <div class="small text-muted">STK: <b th:text="${@environment.getProperty('pos.qr.account-number')}">0987654321</b> - Ngân hàng: <b th:text="${@environment.getProperty('pos.qr.bank-id')}">MB Bank</b></div>
                            </div>
                        </div>

                        <div class="alert alert-info text-start small border-0 bg-info-subtle text-info-emphasis d-flex align-items-center gap-2 mb-3">
                            <i class="bi bi-info-circle-fill fs-5 flex-shrink-0 text-info"></i>
                            <div>Khách hàng quét mã QR trên ứng dụng ngân hàng. Sau khi tài khoản đã nhận tiền, nhân viên bấm nút bên dưới để hoàn tất hóa đơn.</div>
                        </div>

                        <!-- Form xác nhận thanh toán (Bấm được 100%) -->
                        <form th:action="@{/admin/ban-hang/{id}/xac-nhan-qr(id=${hoaDon.id})}" method="post" onsubmit="return confirm('Bạn xác nhận khách hàng đã chuyển khoản thành công?')">
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm py-3">
                                <i class="bi bi-check2-circle me-2"></i> Xác Nhận Đã Nhận Chuyển Khoản
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
